<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>FinFlow - Transfer receipt</title>
    <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="slip-page" data-page="receipt">
<nav class="navbar" aria-label="Main navigation">
    <div class="container navbar-inner">
        <a href="dashboard.html" class="navbar-brand" aria-label="FinFlow dashboard">
            <span class="brand-mark"><i data-lucide="waypoints"></i></span>
            Fin<span>Flow</span>
        </a>
        <div class="nav-links">
            <a class="nav-link" data-nav="dashboard" href="dashboard.html"><i data-lucide="layout-dashboard"></i><span>Overview</span></a>
            <a class="nav-link" data-nav="transfer" href="transfer.html"><i data-lucide="send"></i><span>Transfer</span></a>
            <a class="nav-link" data-nav="history" href="history.html"><i data-lucide="receipt-text"></i><span>Activity</span></a>
        </div>
        <div class="navbar-user">
            <div class="user-chip">
                <span class="user-avatar" data-user-initial></span>
                <span class="navbar-username" id="nav-username"></span>
            </div>
            <button class="btn btn-danger btn-sm btn-icon" type="button" onclick="logout()" title="Log out" aria-label="Log out"><i data-lucide="log-out"></i></button>
        </div>
    </div>
</nav>

<main class="slip-wrapper">
    <div id="slip-loading" class="table-message" aria-live="polite"><span class="spinner"></span></div>

    <article class="slip-card" id="slip-card" hidden aria-label="Transfer receipt">
        <header class="slip-header">
            <div class="slip-brand"><span class="brand-mark"><i data-lucide="waypoints"></i></span>FinFlow receipt</div>
            <div class="slip-status-icon" id="slip-icon"></div>
            <h1 id="slip-amount" class="slip-amount"></h1>
            <p>Transfer record</p>
            <div id="slip-failure-reason" class="slip-failure-reason" hidden></div>
        </header>

        <div class="slip-body">
            <div class="slip-row">
                <span class="slip-label">Status</span>
                <span class="slip-value" id="slip-status-badge"></span>
            </div>
            <div class="slip-row">
                <span class="slip-label">Reference</span>
                <span class="slip-value slip-reference" id="slip-ref"></span>
            </div>
            <div class="slip-row">
                <span class="slip-label">Processed</span>
                <span class="slip-value" id="slip-date"></span>
            </div>
            <div class="slip-row">
                <span class="slip-label">From</span>
                <span class="slip-account">
                    <span class="slip-value" id="slip-from-name"></span>
                    <span class="slip-account-meta" id="slip-from-number"></span>
                    <span class="slip-account-user" id="slip-from-user"></span>
                </span>
            </div>
            <div class="slip-row">
                <span class="slip-label">To</span>
                <span class="slip-account">
                    <span class="slip-value" id="slip-to-name"></span>
                    <span class="slip-account-meta" id="slip-to-number"></span>
                    <span class="slip-account-user" id="slip-to-user"></span>
                </span>
            </div>
            <div class="slip-row">
                <span class="slip-label">Reference note</span>
                <span class="slip-value" id="slip-desc"></span>
            </div>
            <div class="slip-row">
                <span class="slip-label">Balance after</span>
                <span class="slip-value" id="slip-balance-after"></span>
            </div>
            <div class="slip-row" id="slip-fraud-row" hidden>
                <span class="slip-label">Risk score</span>
                <span class="slip-value" id="slip-fraud-score"></span>
            </div>
        </div>

        <footer class="slip-footer">
            <button class="btn btn-primary" type="button" onclick="window.print()"><i data-lucide="printer"></i><span>Print</span></button>
            <a href="transfer.html" class="btn btn-secondary"><i data-lucide="send"></i><span>New transfer</span></a>
            <a href="history.html" class="btn btn-secondary"><i data-lucide="receipt-text"></i><span>Activity</span></a>
        </footer>
    </article>
</main>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/slip.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>FinFlow - Admin overview</title>
    <link rel="stylesheet" href="../css/style.css"/>
</head>
<body data-page="admin-dashboard">
<nav class="navbar" aria-label="Admin navigation">
    <div class="container navbar-inner">
        <a href="admin-dashboard.html" class="navbar-brand" aria-label="FinFlow admin dashboard">
            <span class="brand-mark"><i data-lucide="waypoints"></i></span>
            Fin<span>Flow</span><span class="badge admin-badge">Admin</span>
        </a>
        <div class="nav-links">
            <a class="nav-link" data-nav="admin-dashboard" href="admin-dashboard.html"><i data-lucide="chart-no-axes-combined"></i><span>Overview</span></a>
            <a class="nav-link" data-nav="admin-fraud" href="admin-fraud.html"><i data-lucide="shield-alert"></i><span>Fraud review</span></a>
        </div>
        <div class="navbar-user">
            <div class="user-chip">
                <span class="user-avatar" data-user-initial></span>
                <span class="navbar-username" id="nav-username"></span>
            </div>
            <button class="btn btn-danger btn-sm btn-icon" type="button" onclick="logout()" title="Log out" aria-label="Log out"><i data-lucide="log-out"></i></button>
        </div>
    </div>
</nav>

<main class="container app-main">
    <header class="page-header">
        <div class="page-heading">
            <div class="eyebrow">Operations</div>
            <h1>Fraud operations</h1>
            <p>Live view of alerts, review workload, and elevated-risk activity.</p>
        </div>
        <a href="admin-fraud.html" class="btn btn-primary"><i data-lucide="shield-alert"></i><span>Review alerts</span></a>
    </header>

    <div id="admin-notice" class="admin-notice" role="alert" aria-live="polite"></div>

    <section class="admin-grid" aria-label="Fraud monitoring totals">
        <div class="admin-card">
            <span class="stat-icon"><i data-lucide="bell-ring"></i></span>
            <div class="stat-label">Total alerts</div>
            <div class="admin-number" id="total-alerts">0</div>
        </div>
        <div class="admin-card">
            <span class="stat-icon"><i data-lucide="clock-3"></i></span>
            <div class="stat-label">Pending review</div>
            <div class="admin-number" id="pending-alerts">0</div>
        </div>
        <div class="admin-card">
            <span class="stat-icon"><i data-lucide="triangle-alert"></i></span>
            <div class="stat-label">High risk</div>
            <div class="admin-number" id="high-risk">0</div>
        </div>
        <div class="admin-card">
            <span class="stat-icon"><i data-lucide="list-ordered"></i></span>
            <div class="stat-label">Queue size</div>
            <div class="admin-number" id="queue-size">0</div>
        </div>
    </section>

    <section class="admin-panel" aria-labelledby="recent-alerts-heading">
        <div class="admin-panel-header">
            <div>
                <div class="eyebrow">Latest signals</div>
                <h2 id="recent-alerts-heading">Recent fraud alerts</h2>
            </div>
            <a href="admin-fraud.html" class="btn btn-secondary btn-sm"><i data-lucide="arrow-up-right"></i><span>All alerts</span></a>
        </div>
        <div id="alerts-container"><div class="table-message"><span class="spinner"></span></div></div>
    </section>
</main>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="../js/config.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>

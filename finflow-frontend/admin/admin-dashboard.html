<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0"/>

    <title>FinFlow Admin Dashboard</title>

    <link rel="stylesheet"
          href="../css/style.css"/>

    <style>

        .admin-grid {
            display:grid;
            grid-template-columns:
                repeat(auto-fit,minmax(220px,1fr));
            gap:1rem;
            margin-bottom:2rem;
        }

        .admin-card {
            background:var(--bg-card);
            border:1px solid var(--border);
            border-radius:var(--radius);
            padding:1.5rem;
        }

        .admin-number {
            font-size:2rem;
            font-weight:700;
            margin-top:0.5rem;
        }

    </style>

</head>

<body>

<nav class="navbar">

    <div class="container navbar-inner">

        <a href="#"
           class="navbar-brand">

            Fin<span>Flow</span>

            <span class="badge badge-warning"
                  style="margin-left:0.5rem">
                ADMIN
            </span>

        </a>

        <div class="navbar-user">

            <span class="navbar-username"
                  id="nav-username">
            </span>

            <a href="admin-fraud.html"
               class="btn btn-secondary btn-sm">
                Fraud Monitor
            </a>

            <button class="btn btn-danger btn-sm"
                    onclick="logout()">
                Logout
            </button>

        </div>

    </div>

</nav>

<div class="container">

    <div class="dashboard-header">

        <div>

            <h1>Admin Dashboard</h1>

            <p>
                Internal monitoring and system analytics
            </p>

        </div>

    </div>

    <div class="admin-grid">

        <div class="admin-card">

            <div class="stat-label">
                Total Alerts
            </div>

            <div class="admin-number"
                 id="total-alerts">
                —
            </div>

        </div>

        <div class="admin-card">

            <div class="stat-label">
                Pending Alerts
            </div>

            <div class="admin-number"
                 id="pending-alerts">
                —
            </div>

        </div>

        <div class="admin-card">

            <div class="stat-label">
                High Risk
            </div>

            <div class="admin-number"
                 id="high-risk">
                —
            </div>

        </div>

        <div class="admin-card">

            <div class="stat-label">
                Queue Size
            </div>

            <div class="admin-number"
                 id="queue-size">
                —
            </div>

        </div>

    </div>

    <div style="
        background:var(--bg-card);
        border:1px solid var(--border);
        border-radius:var(--radius);
        padding:1.5rem;
    ">

        <div style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:1rem;
        ">

            <h2>Recent Fraud Alerts</h2>

            <a href="admin-fraud.html"
               class="btn btn-secondary btn-sm">
                View All
            </a>

        </div>

        <div id="alerts-container">

            <div style="
                text-align:center;
                color:var(--text-muted);
                padding:2rem;
            ">

                <span class="spinner"></span>

            </div>

        </div>

    </div>

</div>

<script src="../js/admin.js"></script>

</body>
</html>

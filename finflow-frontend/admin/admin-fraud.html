<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>FinFlow - Fraud review</title>
    <link rel="stylesheet" href="../css/style.css"/>
</head>
<body data-page="admin-fraud">
<nav class="navbar" aria-label="Admin navigation">
    <div class="container navbar-inner">
        <a href="admin-dashboard.html" class="navbar-brand" aria-label="FinFlow admin dashboard">
            <span class="brand-mark"><i data-lucide="waypoints"></i></span>
            Fin<span>Flow</span><span class="badge admin-badge">Admin</span>
        </a>
        <div class="nav-links">
            <a class="nav-link" data-nav="admin-dashboard" href="admin-dashboard.html"><i data-lucide="chart-no-axes-combined"></i><span>Overview</span></a>
            <a class="nav-link" data-nav="admin-fraud" href="admin-fraud.html"><i data-lucide="shield-alert"></i><span>Fraud review</span></a>
        </div>
        <div class="navbar-user">
            <div class="user-chip">
                <span class="user-avatar" data-user-initial></span>
                <span class="navbar-username" id="nav-username"></span>
            </div>
            <button class="btn btn-danger btn-sm btn-icon" type="button" onclick="logout()" title="Log out" aria-label="Log out"><i data-lucide="log-out"></i></button>
        </div>
    </div>
</nav>

<main class="container app-main">
    <header class="page-header">
        <div class="page-heading">
            <div class="eyebrow">Operations</div>
            <h1>Fraud review</h1>
            <p>Assess alerts, resolve decisions, and manage a wallet when action is needed.</p>
        </div>
    </header>

    <div id="admin-notice" class="admin-notice" role="alert" aria-live="polite"></div>

    <section class="admin-panel" aria-labelledby="wallet-control-heading">
        <div class="admin-panel-header">
            <div>
                <div class="eyebrow">Wallet controls</div>
                <h2 id="wallet-control-heading">Manual wallet status</h2>
            </div>
        </div>
        <div class="freeze-controls">
            <div class="form-group">
                <label for="wallet-id">Wallet ID</label>
                <input type="number" id="wallet-id" placeholder="Wallet ID" min="1" inputmode="numeric"/>
            </div>
            <div class="form-group">
                <label for="freeze-reason">Reason</label>
                <input type="text" id="freeze-reason" placeholder="Reason for the status change" maxlength="255"/>
            </div>
            <button class="btn btn-danger" type="button" onclick="freezeWallet()"><i data-lucide="lock-keyhole"></i><span>Freeze</span></button>
            <button class="btn btn-secondary" type="button" onclick="unfreezeWallet()"><i data-lucide="unlock-keyhole"></i><span>Unfreeze</span></button>
        </div>
    </section>

    <section class="admin-panel table-panel" aria-labelledby="fraud-alerts-heading">
        <div class="table-panel-header">
            <div>
                <h2 id="fraud-alerts-heading">Alert queue</h2>
                <p>Latest available fraud signals</p>
            </div>
        </div>
        <div class="table-wrapper">
            <table class="fraud-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Transaction</th>
                    <th>Score</th>
                    <th>Status</th>
                    <th>Rules</th>
                    <th>Created</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="fraud-body">
                <tr><td colspan="7" class="table-message"><span class="spinner"></span></td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="../js/config.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>FinFlow - Activity</title>
    <link rel="stylesheet" href="css/style.css"/>
</head>
<body data-page="history">
<nav class="navbar" aria-label="Main navigation">
    <div class="container navbar-inner">
        <a href="dashboard.html" class="navbar-brand" aria-label="FinFlow dashboard">
            <span class="brand-mark"><i data-lucide="waypoints"></i></span>
            Fin<span>Flow</span>
        </a>
        <div class="nav-links">
            <a class="nav-link" data-nav="dashboard" href="dashboard.html"><i data-lucide="layout-dashboard"></i><span>Overview</span></a>
            <a class="nav-link" data-nav="transfer" href="transfer.html"><i data-lucide="send"></i><span>Transfer</span></a>
            <a class="nav-link" data-nav="history" href="history.html"><i data-lucide="receipt-text"></i><span>Activity</span></a>
        </div>
        <div class="navbar-user">
            <div class="user-chip">
                <span class="user-avatar" data-user-initial></span>
                <span class="navbar-username" id="nav-username"></span>
            </div>
            <button class="btn btn-danger btn-sm btn-icon" type="button" onclick="logout()" title="Log out" aria-label="Log out"><i data-lucide="log-out"></i></button>
        </div>
    </div>
</nav>

<main class="container app-main">
    <header class="page-header">
        <div class="page-heading">
            <div class="eyebrow">Account activity</div>
            <h1>Transactions</h1>
            <p>Review money in, money out, and the details behind every movement.</p>
        </div>
        <a class="btn btn-primary" href="transfer.html"><i data-lucide="send"></i><span>New transfer</span></a>
    </header>

    <section class="filters-panel" aria-label="Transaction filters">
        <div class="form-group">
            <label for="wallet-select">Wallet</label>
            <select id="wallet-select"></select>
        </div>
        <div class="form-group">
            <label for="from-date">From</label>
            <input type="datetime-local" id="from-date"/>
        </div>
        <div class="form-group">
            <label for="to-date">To</label>
            <input type="datetime-local" id="to-date"/>
        </div>
        <div class="filter-actions">
            <button class="btn btn-primary" type="button" onclick="loadHistory()"><i data-lucide="filter"></i><span>Apply</span></button>
            <button class="btn btn-secondary" type="button" onclick="loadStatement()"><i data-lucide="file-text"></i><span>Statement</span></button>
        </div>
    </section>

    <section id="statement-box" class="statement-box" aria-live="polite" hidden></section>

    <section class="table-panel" aria-labelledby="transactions-heading">
        <div class="table-panel-header">
            <div>
                <h2 id="transactions-heading">Transfer ledger</h2>
                <p>Selected wallet and date range</p>
            </div>
            <span id="txn-count" class="feature-status"></span>
        </div>

        <div id="history-loading" class="table-message" aria-live="polite"><span class="spinner"></span></div>
        <div class="table-wrapper">
            <table class="history-table" id="history-table" hidden>
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Reference</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th>Fraud</th>
                    <th>Receipt</th>
                </tr>
                </thead>
                <tbody id="history-body"></tbody>
            </table>
        </div>
    </section>
</main>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/history.js"></script>
</body>
</html>

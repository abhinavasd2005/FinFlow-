<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>FinFlow — Transfer</title>
    <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<nav class="navbar">
    <div class="container navbar-inner">
        <a href="dashboard.html" class="navbar-brand">Fin<span>Flow</span></a>
        <div class="navbar-user">
            <span class="navbar-username" id="nav-username"></span>
            <a href="dashboard.html" class="btn btn-secondary btn-sm">Dashboard</a>
            <a href="history.html" class="btn btn-secondary btn-sm">History</a>
            <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
        </div>
    </div>
</nav>

<div class="container">
    <div class="dashboard-header">
        <div>
            <h1>Transfer Funds</h1>
            <p>Send money to any wallet instantly</p>
        </div>
    </div>

    <div style="max-width:520px;margin:0 auto">
        <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:2rem">
            <div id="transfer-alert" class="alert"></div>

            <div class="form-group">
                <label>From Wallet</label>
                <select id="from-wallet">
                    <option value="">Loading wallets...</option>
                </select>
                <div id="from-balance" style="font-size:0.8rem;color:var(--text-muted);margin-top:0.4rem"></div>
            </div>

            <div class="form-group">
                <label>To Wallet Number</label>
                <input type="text" id="to-wallet-number" placeholder="Enter destination wallet number e.g. WLT-XXXXXXXX"/>
                <div id="wallet-lookup-status" style="font-size:0.8rem;margin-top:0.4rem"></div>
            </div>

            <div class="form-group">
                <label>Amount ($)</label>
                <input type="number" id="transfer-amount" placeholder="0.00" min="0.01" step="0.01"/>
            </div>

            <div class="form-group">
                <label>Description <span style="color:var(--text-muted)">(optional)</span></label>
                <input type="text" id="transfer-desc" placeholder="e.g. Rent payment, Invoice #123"/>
            </div>

            <hr class="divider"/>

            <div style="background:var(--bg-input);border-radius:var(--radius-sm);padding:1rem;margin-bottom:1.25rem;font-size:0.85rem">
                <div style="display:flex;justify-content:space-between;margin-bottom:0.4rem">
                    <span style="color:var(--text-muted)">From</span>
                    <span id="slip-from">—</span>
                </div>
                <div style="display:flex;justify-content:space-between;margin-bottom:0.4rem">
                    <span style="color:var(--text-muted)">To</span>
                    <span id="slip-to">—</span>
                </div>
                <div style="display:flex;justify-content:space-between">
                    <span style="color:var(--text-muted)">Amount</span>
                    <span id="slip-amount" style="font-weight:700;color:var(--accent)">—</span>
                </div>
            </div>

            <button class="btn btn-primary" onclick="submitTransfer()">
                <span id="transfer-btn-text">Send Money</span>
            </button>
        </div>
    </div>
</div>

<script src="js/transfer.js"></script>
</body>
</html>
